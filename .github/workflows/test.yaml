name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make check
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned cluster tools
        run: bash .github/scripts/install-tools.sh
      - name: Qualify real cluster installation and cleanup
        env:
          EGTEST_EG_VERSION: v1.9.1
          EGTEST_K3S_VERSION: v1.33.13-k3s2
          EGTEST_REPORT: ${{ runner.temp }}/egtest-result.json
        run: make integration
      - name: Upload safe qualification result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installation-result
          path: ${{ runner.temp }}/egtest-result.json
          if-no-files-found: warn
